<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f4c42">
  <title>Event Desk — MJ Ahmad</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f2;
      --panel: #fff;
      --ink: #17211d;
      --muted: #64716b;
      --line: #d9dfdb;
      --pine: #0f4c42;
      --pine-dark: #092f29;
      --brass: #b8862b;
      --selected: #e3eeea;
      --green: #2e7d4f;
      --amber: #a56a11;
      --red: #b3412e;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font: 15px/1.6 "Hind Siliguri", "Noto Sans Bengali",
            "Kalpurush", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1514;
        --panel: #161e1c;
        --ink: #e6ece9;
        --muted: #93a29c;
        --line: #26332f;
        --pine: #5fb59f;
        --pine-dark: #0b3a32;
        --brass: #d4a74a;
        --selected: #1e2d29;
        --green: #70c690;
        --amber: #e6b66e;
        --red: #e1705b;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
    button, input { font: inherit; }
    a { color: var(--pine); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

    .topbar {
      position: relative; z-index: 50; height: 58px; display: flex;
      align-items: center; gap: 10px; padding: 7px 16px;
      background: var(--pine-dark); color: #f3f5f2;
    }

    .brand {
      display: flex; min-width: 190px; align-items: center; gap: 10px;
      color: inherit; text-decoration: none;
    }

    .brand-mark {
      width: 35px; height: 35px; display: grid; flex: none;
      place-items: center; border: 1px solid #ffffff25; border-radius: 10px;
      background: #ffffff12; color: var(--brass); font-size: 19px;
    }

    .brand-copy { min-width: 0; line-height: 1.2; }
    .brand-copy strong { display: block; font-size: 15px; }
    .brand-copy small { display: block; margin-top: 3px; color: #ffffffb8; font-size: 11px; }

    #search {
      width: min(460px, 55vw); min-width: 150px; margin-left: auto;
      padding: 8px 12px; border: 1px solid #ffffff40; border-radius: 9px;
      outline: none; background: #ffffff16; color: #fff; font: inherit; font-size: 14px;
    }

    #search::placeholder { color: #ffffffae; }
    #search:focus { border-color: var(--brass); }

    .menu-toggle {
      display: none; width: 36px; height: 36px; place-items: center;
      border: 0; border-radius: 8px; background: transparent; color: #fff;
      font-size: 21px; cursor: pointer;
    }

    .workspace {
      height: calc(100dvh - 58px); display: grid;
      grid-template-columns: 290px minmax(0, 1fr); min-height: 0;
    }

    .sidebar {
      min-height: 0; overflow: auto; padding: 12px 8px 20px;
      border-right: 1px solid var(--line); background: var(--panel);
      overscroll-behavior: contain;
    }

    .sidebar-heading {
      display: flex; justify-content: space-between; align-items: center;
      margin: 3px 9px 10px; color: var(--muted);
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
    }

    #event-count { margin: 0 9px 8px; color: var(--muted); font-size: 12px; }
    #event-list { display: grid; gap: 4px; }

    .event-button {
      width: 100%; padding: 10px; border: 0; border-radius: 9px;
      background: transparent; color: var(--ink); text-align: left; cursor: pointer;
    }

    .event-button:hover { background: var(--bg); }
    .event-button[aria-current="page"] {
      background: var(--selected); color: var(--pine);
      box-shadow: inset 3px 0 var(--brass);
    }

    .event-button strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-button small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

    .content {
      min-width: 0; min-height: 0; overflow: auto;
      padding: 24px 28px calc(38px + var(--safe-bottom));
      overscroll-behavior: contain;
    }

    .inner { width: min(100%, 1120px); margin: 0 auto; }

    .hero {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 16px;
    }

    .hero h1 { margin: 0; font-size: clamp(23px, 3vw, 32px); line-height: 1.3; overflow-wrap: anywhere; }
    .subtitle { margin: 5px 0 0; color: var(--muted); }
    .event-id { color: var(--pine); font: 12px ui-monospace, Menlo, Consolas, monospace; }

    .status {
      flex: none; padding: 4px 10px; border: 1px solid var(--line);
      border-radius: 20px; background: var(--panel); color: var(--muted); font-size: 12px;
    }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px; margin: 16px 0;
    }

    .stat {
      padding: 13px 15px; border: 1px solid var(--line); border-radius: 11px;
      background: var(--panel);
    }

    .stat strong { display: block; font-size: 21px; line-height: 1.3; }
    .stat span { color: var(--muted); font-size: 12px; }

    .readiness {
      margin: 14px 0 20px; padding: 15px; border: 1px solid var(--line);
      border-radius: 11px; background: var(--panel);
    }

    .readiness-top {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 8px; margin-bottom: 9px;
    }

    .readiness-top strong { font-size: 14px; }
    .readiness-top span { color: var(--pine); font-weight: 700; }

    .progress-track {
      height: 10px; overflow: hidden; border-radius: 8px; background: var(--line);
    }

    .progress-bar {
      height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, var(--pine), var(--brass));
      transition: width .25s ease;
    }

    .readiness-note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }

    .section {
      margin: 18px 0; padding: 16px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--panel);
    }

    .section h2 { margin: 0 0 12px; font-size: 17px; }
    .section-subtitle { margin: -7px 0 12px; color: var(--muted); font-size: 12px; }

    .agenda-item,
    .requirement-item,
    .file-item,
    .audit-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 11px 0; border-top: 1px solid var(--line);
    }

    .agenda-item:first-of-type,
    .requirement-item:first-of-type,
    .file-item:first-of-type,
    .audit-item:first-of-type { border-top: 0; }

    .item-symbol {
      width: 27px; height: 27px; display: grid; flex: none;
      place-items: center; border-radius: 8px; background: var(--selected);
      color: var(--pine); font-size: 13px; font-weight: 700;
    }

    .item-body { min-width: 0; flex: 1; }
    .item-body strong { display: block; overflow-wrap: anywhere; }
    .item-body p { margin: 3px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .item-side { flex: none; color: var(--muted); font-size: 11px; text-align: right; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      background: var(--bg); color: var(--muted); font-size: 11px;
    }

    .badge.verified,
    .badge.completed { background: #2e7d4f18; color: var(--green); }
    .badge.pending { background: #b8862b18; color: var(--amber); }
    .badge.waived { background: var(--bg); color: var(--muted); }

    .file-link {
      display: inline-block; margin-top: 5px; font-size: 12px;
      overflow-wrap: anywhere;
    }

    .hash {
      display: block; margin-top: 4px; color: var(--muted);
      font: 10px/1.5 ui-monospace, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .audit-list { max-height: 340px; overflow: auto; }
    .audit-time { display: block; color: var(--muted); font-size: 11px; }
    .audit-details { margin-top: 4px; font-size: 12px; overflow-wrap: anywhere; }

    .empty,
    .message { padding: 18px 8px; color: var(--muted); text-align: center; }

    .mobile-nav { display: none; }

    @media (max-width: 820px) {
      .topbar { height: 52px; gap: 7px; padding: 6px 9px; }
      .brand { min-width: 0; gap: 7px; }
      .brand-mark { width: 32px; height: 32px; }
      .brand-copy strong { font-size: 14px; }
      .brand-copy small { display: none; }
      .menu-toggle { display: grid; }
      #search { width: auto; min-width: 0; flex: 1; margin-left: auto; padding: 7px 9px; font-size: 12px; }

      .workspace { height: calc(100dvh - 52px); display: block; }
      .sidebar {
        position: fixed; z-index: 45; top: 52px;
        bottom: calc(64px + var(--safe-bottom)); left: 0;
        width: min(320px, 88vw); padding: 12px 9px;
        box-shadow: 5px 0 25px #0004; transform: translateX(-105%);
        transition: transform .2s ease;
      }
      .sidebar.on { transform: translateX(0); }
      .content { width: 100%; height: 100%; padding: 16px 12px calc(78px + var(--safe-bottom)); }
      .hero { gap: 8px; }
      .hero h1 { font-size: 23px; }
      .section { padding: 13px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .stat { padding: 10px 11px; }
      .stat strong { font-size: 18px; }

      .mobile-nav {
        position: fixed; z-index: 60; right: 0; bottom: 0; left: 0;
        height: calc(62px + var(--safe-bottom));
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: start; padding: 5px 4px var(--safe-bottom);
        border-top: 1px solid var(--line); background: var(--panel);
        box-shadow: 0 -3px 16px #0000000d;
      }

      .mobile-nav a,
      .mobile-nav button {
        min-width: 0; height: 49px; display: flex;
        align-items: center; justify-content: center; flex-direction: column;
        gap: 1px; padding: 2px; border: 0; border-radius: 9px;
        background: transparent; color: var(--muted); font: inherit;
        font-size: 10px; line-height: 1.2; text-decoration: none; cursor: pointer;
      }

      .mobile-nav .active { color: var(--pine); font-weight: 650; }
      .nav-icon { height: 23px; display: grid; place-items: center; font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

    @media print {
      body { height: auto; overflow: visible; background: #fff; color: #111; }
      .topbar, .sidebar, .mobile-nav { display: none !important; }
      .workspace, .content { height: auto; display: block; overflow: visible; padding: 0; }
      .section, .stat, .readiness { break-inside: avoid; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button
      id="menu-toggle"
      class="menu-toggle"
      type="button"
      aria-label="ইভেন্ট তালিকা খুলুন"
      aria-expanded="false"
      aria-controls="sidebar"
    >☰</button>

    <a class="brand" href="../" aria-label="মূল পাতা">
      <span class="brand-mark" aria-hidden="true">◷</span>
      <span class="brand-copy">
        <strong>Event Desk</strong>
        <small>পরিকল্পনা · নথি · অগ্রগতি</small>
      </span>
    </a>

    <input
      id="search"
      type="search"
      placeholder="ইভেন্ট, ID, agenda, requirement বা ফাইল খুঁজুন…"
      aria-label="ইভেন্ট খুঁজুন"
      autocomplete="off"
    >
  </header>

  <main class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="ইভেন্ট তালিকা">
      <div class="sidebar-heading">ইভেন্টসমূহ</div>
      <p id="event-count" aria-live="polite">লোড হচ্ছে…</p>
      <div id="event-list"></div>
    </aside>

    <article id="content" class="content" tabindex="-1" aria-live="polite">
      <div class="inner">
        <div class="empty">ইভেন্ট তালিকা লোড হচ্ছে…</div>
      </div>
    </article>
  </main>

  <nav class="mobile-nav" aria-label="প্রধান নেভিগেশন">
    <a href="../"><span class="nav-icon">⌂</span><span>মেইন সাইট</span></a>
    <a href="../#/dash"><span class="nav-icon">▦</span><span>ড্যাশবোর্ড</span></a>
    <a href="../learn/"><span class="nav-icon">◆</span><span>লার্নিং</span></a>
    <a href="../terminal/"><span class="nav-icon">&gt;_</span><span>টার্মিনাল</span></a>
    <button id="bottom-menu" class="active" type="button" aria-expanded="false" aria-controls="sidebar">
      <span class="nav-icon">☰</span><span>ইভেন্ট</span>
    </button>
  </nav>

  <script>
    (() => {
      "use strict";

      const sidebar = document.querySelector("#sidebar");
      const eventList = document.querySelector("#event-list");
      const eventCount = document.querySelector("#event-count");
      const content = document.querySelector("#content");
      const search = document.querySelector("#search");
      const menuToggle = document.querySelector("#menu-toggle");
      const bottomMenu = document.querySelector("#bottom-menu");

      let events = [];
      let auditRows = [];
      let selectedId = "";
      let requestNumber = 0;

      const mobile = () => matchMedia("(max-width: 820px)").matches;
      const clean = value => String(value ?? "").toLocaleLowerCase().trim();

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function setMenu(open) {
        sidebar.classList.toggle("on", open);
        menuToggle.setAttribute("aria-expanded", String(open));
        bottomMenu.setAttribute("aria-expanded", String(open));
      }

      function displayDate(value) {
        if (!value) return "—";
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? String(value)
          : date.toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" });
      }

      function searchText(event) {
        const values = [
          event.id, event.title, event.event_type, event.status, event.date,
          event.venue, event.owner, event.purpose, event.description
        ];

        (event.agenda || []).forEach(item => values.push(
          item.id, item.title, item.owner, item.status, item.notes
        ));
        (event.requirements || []).forEach(item => values.push(
          item.id, item.title, item.category, item.status, item.notes
        ));
        (event.files || []).forEach(item => values.push(
          item.id, item.original_name, item.stored_path, item.extension,
          item.description, item.requirement_id, item.agenda_id
        ));

        return values.map(clean).join(" ");
      }

      function renderEventList() {
        const terms = clean(search.value).split(/\s+/).filter(Boolean);
        const matches = events.filter(event => {
          const text = searchText(event);
          return terms.every(term => text.includes(term));
        });

        eventCount.textContent = `${matches.length}টি ইভেন্ট`;
        eventList.replaceChildren();

        if (!matches.length) {
          eventList.append(el("p", "message", "কোনো ইভেন্ট মেলেনি।"));
          return;
        }

        for (const event of matches) {
          const button = el("button", "event-button");
          button.type = "button";
          button.setAttribute("aria-current", event.id === selectedId ? "page" : "false");

          const title = el("strong", "", event.title || event.slug);
          const info = el("small", "", `${event.id} · ${event.date || "তারিখ নির্ধারিত নয়"}`);
          button.append(title, info);
          button.addEventListener("click", () => openEvent(event));
          eventList.append(button);
        }
      }

      function addSection(parent, title, subtitle = "") {
        const section = el("section", "section");
        const heading = el("h2", "", title);
        section.append(heading);
        if (subtitle) section.append(el("p", "section-subtitle", subtitle));
        parent.append(section);
        return section;
      }

      function statusBadge(status) {
        const badge = el("span", `badge ${status || "pending"}`, status || "pending");
        const labels = {
          pending: "Մুলতুবি",
          planned: "পরিকল্পিত",
          collected: "সংগৃহীত",
          verified: "যাচাইকৃত",
          completed: "সম্পন্ন",
          in_progress: "চলমান",
          waived: "প্রযোজ্য নয়"
        };
        badge.textContent = labels[status] || status || "—";
        return badge;
      }

      function renderAgenda(parent, event) {
        const section = addSection(parent, "এজেন্ডা", `${(event.agenda || []).length}টি agenda item`);

        if (!(event.agenda || []).length) {
          section.append(el("p", "empty", "এখনও agenda যোগ করা হয়নি।"));
          return;
        }

        for (const item of event.agenda) {
          const row = el("div", "agenda-item");
          row.append(el("span", "item-symbol", "◷"));

          const body = el("div", "item-body");
          body.append(el("strong", "", `${item.id || ""} ${item.title || ""}`.trim()));
          const detail = [
            item.start_time && `সময়: ${item.start_time}`,
            item.duration_minutes && `${item.duration_minutes} মিনিট`,
            item.owner && `দায়িত্ব: ${item.owner}`,
            item.notes
          ].filter(Boolean).join(" · ");
          if (detail) body.append(el("p", "", detail));

          const side = el("div", "item-side");
          side.append(statusBadge(item.status));
          row.append(body, side);
          section.append(row);
        }
      }

      function renderRequirements(parent, event) {
        const requirements = event.requirements || [];
        const section = addSection(
          parent,
          "প্রয়োজনীয়তা ও প্রস্তুতি",
          "Verified মানে নথি/তথ্য যাচাই করা হয়েছে; এটি বাইরের নিশ্চয়তা নয়।"
        );

        if (!requirements.length) {
          section.append(el("p", "empty", "এখনও requirement যোগ করা হয়নি।"));
          return;
        }

        for (const item of requirements) {
          const row = el("div", "requirement-item");
          row.append(el("span", "item-symbol", item.status === "verified" ? "✓" : "•"));

          const body = el("div", "item-body");
          body.append(el("strong", "", `${item.id || ""} ${item.title || ""}`.trim()));
          const detail = [
            item.category,
            item.required === false ? "ঐচ্ছিক" : "আবশ্যক",
            item.notes
          ].filter(Boolean).join(" · ");
          if (detail) body.append(el("p", "", detail));

          const side = el("div", "item-side");
          side.append(statusBadge(item.status));
          row.append(body, side);
          section.append(row);
        }
      }

      function safeRelativeUrl(url) {
        if (typeof url !== "string" || !url || url.startsWith("/")) return "";
        const parts = url.split("/");
        if (parts.some(part => !part || part === "." || part === "..")) return "";
        return parts.map(encodeURIComponent).join("/");
      }

      function renderFiles(parent, event) {
        const files = event.files || [];
        const section = addSection(parent, "সংযুক্ত ফাইল", `${files.length}টি ফাইল`);

        if (!files.length) {
          section.append(el("p", "empty", "এখনও কোনো ফাইল সংযুক্ত করা হয়নি।"));
          return;
        }

        for (const file of files) {
          const row = el("div", "file-item");
          row.append(el("span", "item-symbol", "▤"));

          const body = el("div", "item-body");
          body.append(el("strong", "", file.original_name || file.id));
          const info = [
            file.id,
            file.extension,
            file.bytes != null ? `${Number(file.bytes).toLocaleString()} bytes` : "",
            file.requirement_id && `Requirement: ${file.requirement_id}`,
            file.agenda_id && `Agenda: ${file.agenda_id}`,
            file.description
          ].filter(Boolean).join(" · ");
          body.append(el("p", "", info));

          const url = safeRelativeUrl(file.url);
          if (url) {
            const link = el("a", "file-link", "ফাইল খুলুন");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            body.append(link);
          }

          if (file.sha256) body.append(el("code", "hash", `SHA-256: ${file.sha256}`));

          const side = el("div", "item-side", displayDate(file.added_at));
          row.append(body, side);
          section.append(row);
        }
      }

      function renderAudit(parent, event) {
        const rows = auditRows.filter(row => row.event_id === event.id);
        const section = addSection(parent, "Audit log", `${rows.length}টি রেকর্ড`);

        if (!rows.length) {
          section.append(el("p", "empty", "Audit log পাওয়া যায়নি বা এখনও তৈরি হয়নি।"));
          return;
        }

        const list = el("div", "audit-list");
        for (const item of [...rows].reverse()) {
          const row = el("div", "audit-item");
          row.append(el("span", "item-symbol", "↳"));

          const body = el("div", "item-body");
          body.append(el("strong", "", item.action || "পরিবর্তন"));
          body.append(el("span", "audit-time", `${displayDate(item.timestamp)} · ${item.actor || "user"}`));

          const details = el("div", "audit-details");
          details.textContent = JSON.stringify(item.details || {});
          body.append(details);

          row.append(body);
          list.append(row);
        }
        section.append(list);
      }

      function renderEvent(event) {
        const inner = el("div", "inner");

        const hero = el("div", "hero");
        const titleBlock = el("div");
        titleBlock.append(el("h1", "", event.title || event.slug));
        titleBlock.append(el("p", "subtitle", event.purpose || event.description || event.event_type || ""));
        titleBlock.append(el("code", "event-id", event.id || ""));
        hero.append(titleBlock, statusBadge(event.status));
        inner.append(hero);

        const readiness = event.readiness || {};
        const percent = Math.max(0, Math.min(100, Number(readiness.percent) || 0));

        const progress = el("section", "readiness");
        const progressTop = el("div", "readiness-top");
        progressTop.append(el("strong", "", readiness.label || "Աবশ্যক নথির প্রস্তুতি"));
        progressTop.append(el("span", "", `${percent}%`));

        const track = el("div", "progress-track");
        const bar = el("div", "progress-bar");
        bar.style.width = `${percent}%`;
        track.append(bar);

        const note = el(
          "p",
          "readiness-note",
          `${readiness.verified_required || 0} / ${readiness.required_total || 0} আবশ্যক requirement verified। ` +
          "শতাংশটি checklist-ভিত্তিক; সব তথ্য বাস্তবে সঠিক বা সম্পূর্ণ—তার নিশ্চয়তা নয়।"
        );

        progress.append(progressTop, track, note);
        inner.append(progress);

        const stats = el("div", "stats");
        const values = [
          [event.date || "নির্ধারিত নয়", "ইভেন্টের তারিখ"],
          [event.venue || "নির্ধারিত নয়", "স্থান"],
          [(event.agenda || []).length, "Agenda item"],
          [(event.files || []).length, "সংযুক্ত ফাইল"]
        ];

        for (const [value, label] of values) {
          const stat = el("div", "stat");
          stat.append(el("strong", "", value));
          stat.append(el("span", "", label));
          stats.append(stat);
        }
        inner.append(stats);

        renderAgenda(inner, event);
        renderRequirements(inner, event);
        renderFiles(inner, event);
        renderAudit(inner, event);

        content.replaceChildren(inner);
        content.scrollTo({ top: 0, behavior: "smooth" });
        document.title = `${event.title || "Event"} — Event Desk`;
      }

      function openEvent(event) {
        selectedId = event.id;
        renderEventList();
        if (mobile()) setMenu(false);
        renderEvent(event);
      }

      async function loadData() {
        try {
          const response = await fetch("data.json", { cache: "no-cache" });
          if (!response.ok) throw new Error(`events/data.json: HTTP ${response.status}`);

          const data = await response.json();
          if (!data || !Array.isArray(data.events)) {
            throw new Error("events/data.json-এর format সঠিক নয়।");
          }

          events = data.events;
          renderEventList();

          try {
            const auditResponse = await fetch("audit.jsonl", { cache: "no-cache" });
            if (auditResponse.ok) {
              const text = await auditResponse.text();
              auditRows = text.split(/\r?\n/).filter(Boolean).flatMap(line => {
                try { return [JSON.parse(line)]; } catch { return []; }
              });
            }
          } catch {
            auditRows = [];
          }

          if (!events.length) {
            showMessage(content, "এখনও ইভেন্ট নেই। `./run.sh event new --title ...` দিয়ে শুরু করুন।");
            return;
          }

          const hashSlug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
          const selected = events.find(event => event.slug === hashSlug) || events[0];
          openEvent(selected);
        } catch (error) {
          showMessage(content, `${error.message || error} — আগে event index তৈরি করুন।`, true);
        }
      }

      function showMessage(parent, text, isError = false) {
        const inner = el("div", "inner");
        inner.append(el("p", isError ? "error-box" : "empty", text));
        parent.replaceChildren(inner);
      }

      search.addEventListener("input", renderEventList);
      menuToggle.addEventListener("click", () => setMenu(!sidebar.classList.contains("on")));
      bottomMenu.addEventListener("click", () => setMenu(!sidebar.classList.contains("on")));

      content.addEventListener("click", () => {
        if (mobile() && sidebar.classList.contains("on")) setMenu(false);
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && sidebar.classList.contains("on")) {
          setMenu(false);
          menuToggle.focus();
        }
        if (event.key === "/" && !/INPUT|TEXTAREA/.test(event.target.tagName || "")) {
          event.preventDefault();
          search.focus();
        }
      });

      window.addEventListener("resize", () => {
        if (!mobile()) setMenu(false);
      });

      loadData();
    })();
  </script>
</body>
</html>
