<head>

<title>MJ Ahmad — Docs Registry</title>

<style>
:root{--bg:#F3F5F2;--pan:#FFF;--ink:#16211E;--mut:#5F6E69;--line:#D9DFDB;--pine:#0F4C42;--brass:#B8862B;--ok:#2E7D4F;--bad:#B3412E;--sel:#E3EEEA;--code:#0F1917;--codeink:#D8E4DF;--r:8px}
@media(prefers-color-scheme:dark){:root{--bg:#0F1514;--pan:#161E1C;--ink:#E6ECE9;--mut:#93A29C;--line:#26332F;--pine:#5FB59F;--brass:#D4A74A;--ok:#5DB985;--bad:#E1705B;--sel:#1E2D29}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.55 "Hind Siliguri","Noto Sans Bengali","Kalpurush","Nirmala UI","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* header */
header{flex:none;display:flex;align-items:center;gap:12px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:var(--pine);color:#F3F5F2}
@media(prefers-color-scheme:dark){header{background:#0B3A32}}
.logo{width:34px;height:34px;flex:none;border-radius:8px;background:#0A3B33;display:grid;place-items:center;color:#D4A74A}
.logo .i{stroke-width:2.4}
header h1{font-size:17px;font-weight:700;line-height:1.2}
header small{display:block;opacity:.8;font-size:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}.brand h1,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q{margin-left:auto;width:min(340px,40%);padding:7px 11px;border-radius:var(--r);border:1px solid #ffffff44;background:#ffffff1c;color:#fff;font:inherit}
#q::placeholder{color:#ffffffaa}
#burger{display:none;background:none;border:0;color:#fff;padding:2px}
.lang{display:flex;border:1px solid #ffffff55;border-radius:var(--r);overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#fff;padding:5px 11px;font-size:13px;font-weight:600;opacity:.75}
.lang button+button{border-left:1px solid #ffffff55}
.lang button.on{background:var(--brass);opacity:1}
/* layout */
.main{flex:1;display:flex;min-height:0}
nav{width:278px;flex:none;overflow:auto;background:var(--pan);border-right:1px solid var(--line);padding:10px 8px;overscroll-behavior:contain}
nav ul{list-style:none;padding:0}
nav ul ul{margin-left:13px;border-left:1px solid var(--line);padding-left:3px}
.nr{display:flex;align-items:center;border-radius:var(--r)}
.nr:hover{background:var(--sel)}
.nr.act{background:var(--sel);color:var(--pine);font-weight:600;box-shadow:inset 3px 0 var(--brass)}
.nr>a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:7px 8px}
.nr>a span.lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chv{width:26px;height:30px;flex:none;border:0;background:none;color:var(--mut);display:grid;place-items:center}
.chv .i{width:14px;height:14px;transition:transform .15s}
.chv[aria-expanded=true] .i{transform:rotate(90deg)}
.chv.sp{visibility:hidden}
.cnt{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--mut);margin-right:6px;flex:none}
.nr.top{font-size:15.5px}
.nl{color:var(--mut);font-size:13px;padding:4px 34px}
#view{flex:1;min-width:0;overflow:auto;padding:22px 26px 30px;overscroll-behavior:contain;scroll-behavior:auto}
.wrap{max-width:1040px;margin:0 auto}
h2{font-size:22px;line-height:1.3;margin-bottom:2px}
h3{font-size:15px;margin:22px 0 8px;color:var(--pine)}
.sub{color:var(--mut);margin-bottom:14px}
.crumb{display:flex;flex-wrap:wrap;gap:2px 6px;color:var(--mut);font-size:13.5px;margin-bottom:8px}
.crumb a{color:var(--pine)}.crumb a:hover{text-decoration:underline}
.empty{padding:44px 0;color:var(--mut);text-align:center}
/* dashboard */
.hero{padding:6px 0 18px}
.hero .tg{font-style:italic;color:var(--mut);max-width:620px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.card{display:flex;gap:14px;align-items:center;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--pine);transform:translateY(-1px)}
.card.big{background:var(--pine);color:#F3F5F2;border-color:var(--pine)}
@media(prefers-color-scheme:dark){.card.big{background:#0B3A32}}
.card .cic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--sel);color:var(--pine);flex:none}
.card.big .cic{background:#ffffff1f;color:#D4A74A}
.card .i{width:22px;height:22px}
.card b{font-size:18px;display:block;line-height:1.25}
.card span{font-size:13.5px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:8px}
.stat{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.stat b{font-size:25px;display:block;line-height:1.15}.stat span{color:var(--mut);font-size:13px}
.lbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:4px 0 10px}
.lbar i{display:block;background:var(--lc,#6B7B76)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut)}
.leg a{display:inline-flex;align-items:center;gap:6px}.leg a:hover{color:var(--ink)}
.leg i{width:9px;height:9px;border-radius:50%;background:var(--lc,#6B7B76)}
.sk{background:linear-gradient(90deg,var(--line),var(--sel),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--r);height:62px}
@keyframes sh{to{background-position:-200% 0}}
/* folders & files */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:6px}
.fd{display:flex;align-items:center;gap:10px;background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fd:hover{border-color:var(--pine)}
.fd .i{color:var(--brass);width:20px;height:20px}
.fd b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd small{color:var(--mut);font-size:12px}
.fd>div{min-width:0;flex:1}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--pan);border-radius:16px;padding:2px 12px;font-size:13px}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.bar label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mut)}
.bar select{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--pan);color:var(--ink);border-radius:var(--r);padding:3px 8px}
.bar .sp{flex:1}
.lg{background:var(--lc,#6B7B76);color:#fff;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 8px;letter-spacing:.3px;white-space:nowrap;display:inline-block}
.l-html{--lc:#D8552B}.l-json{--lc:#A38F1A}.l-python{--lc:#3776AB}.l-node{--lc:#3F8A36}.l-shell{--lc:#3E8E3E}.l-css{--lc:#2965F1}.l-ts{--lc:#3178C6}.l-react{--lc:#1F8EA8}.l-markdown{--lc:#5B6B8C}.l-sql{--lc:#8A5AA8}.l-yaml{--lc:#B5457A}.l-xml{--lc:#8C6A2E}.l-php{--lc:#6E78B4}.l-go{--lc:#2F9FB8}.l-rust{--lc:#B1553A}.l-java{--lc:#B07219}.l-csharp{--lc:#68217A}.l-svg{--lc:#C7761E}
.fr{display:grid;grid-template-columns:78px minmax(0,1fr) 70px 80px 108px;gap:12px;align-items:center;background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:6px}
a.fr:hover{border-color:var(--pine)}
.fr .t{min-width:0}.fr .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .t small{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .m{color:var(--mut);font-size:13px;text-align:right;white-space:nowrap}
.fr.reg{grid-template-columns:132px 78px minmax(0,1fr) minmax(0,.7fr) 66px 78px 104px}
.fr.reg .m.l{text-align:left;overflow:hidden;text-overflow:ellipsis}
.fr.hd{background:none;border:0;padding:0 12px;margin-bottom:2px;color:var(--mut);font-size:12.5px}
.fr.hd button{background:none;border:0;padding:3px 0;text-align:left;color:inherit;font-size:inherit;font-weight:600}
.fr.hd button.r{text-align:right}
.fr.hd button[aria-sort]{color:var(--pine)}
.id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--pine)}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--pan);border-radius:var(--r);padding:7px 18px;font-size:14px}
.more:hover{border-color:var(--pine);color:var(--pine)}
/* document viewer */
.dh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.dh .tt{flex:1;min-width:220px}
.dh h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;word-break:break-word}
.meta{color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px;margin:4px 0 12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--pan);border-radius:var(--r);padding:5px 14px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--pine);color:var(--pine)}
.cb{display:flex;background:var(--code);color:var(--codeink);font:12.5px/1.6 ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;border-radius:var(--r);overflow:auto;max-height:calc(100vh - 290px);min-height:120px}
.cb pre{margin:0}
.cb .gt{padding:10px 10px 10px 12px;color:#5F7A72;text-align:right;user-select:none;border-right:1px solid #ffffff14;position:sticky;left:0;background:var(--code);flex:none}
.cb .cd{padding:10px 16px;flex:1;min-width:0;tab-size:2}
.note{color:var(--mut);font-size:13px;margin-top:8px;text-align:center}
.err{padding:30px 0;text-align:center;color:var(--bad)}.err small{display:block;color:var(--mut);margin-top:6px}
/* footer */
footer{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));background:var(--pan);border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}
footer .fm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pine);background:var(--pine);color:#fff;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600}
.fab .i{width:15px;height:15px}
@media(prefers-color-scheme:dark){.fab{color:#0F1514}}
/* command center */
.sheet{position:fixed;inset:0;z-index:60;background:#0009;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sh{width:min(760px,100%);max-height:86vh;max-height:86dvh;background:var(--pan);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px #0006;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#gp{touch-action:none}
.grip{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.shh{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 4px}
.shh b{font-size:17px;color:var(--pine)}
.x{background:none;border:0;font-size:24px;color:var(--mut);min-width:36px;height:36px}
.tabs{display:flex;gap:6px;padding:4px 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs .chip{white-space:nowrap;padding:5px 14px}
.shb{overflow:auto;flex:1;min-height:200px;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sq{width:100%;padding:9px 12px;margin-bottom:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.ci{border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.ci.em{border-left-color:var(--bad)}
.ci-d{font-size:13.5px;margin-bottom:6px}
.ci-r{display:flex;gap:8px;align-items:stretch}
.ci-r code{flex:1;min-width:0;background:var(--code);color:var(--codeink);border-radius:var(--r);padding:7px 10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;user-select:all}
.ci-r button,.tl{border:1px solid var(--line);background:var(--pan);border-radius:var(--r);padding:6px 12px;font-size:13px;white-space:nowrap}
.ci-r button:hover,.tl:hover{border-color:var(--pine);color:var(--pine)}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tl{padding:14px 10px;text-align:center;font-size:14px;background:var(--bg)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-bottom:14px}.kv>:nth-child(odd){color:var(--mut)}
.sh h4{margin:10px 0 6px;font-size:14px;color:var(--pine)}
kbd{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--bg)}
@media(min-width:821px){.sheet{align-items:center}.sh{border-radius:16px}}
@media(max-width:820px){
 #burger{display:block}
 nav{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:40;transform:translateX(-102%);transition:transform .2s;width:min(300px,86vw)}
 nav.on{transform:none;box-shadow:4px 0 24px #0005}
 #view{padding:16px 14px 26px}
 #q{width:auto;flex:1;min-width:0}
 .brand>div{display:none}
 .fr{grid-template-columns:64px minmax(0,1fr) auto;gap:8px}.fr .m.h{display:none}
 .fr.reg{grid-template-columns:auto 1fr}.fr.reg .m{display:none}.fr.reg .t{grid-column:1/-1}
 .fr.hd{display:none}
 .cb{max-height:calc(100vh - 250px)}
 .sh{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
@media print{header,nav,footer,.acts,.bar,.more{display:none!important}body,#view{overflow:visible;height:auto}.cb{max-height:none}}
</style>
</head>

async function docView(w,id,my){
  const t=T(),f=DB.byId.get(id);
  if(!f){w.innerHTML=`<div class="empty">${esc(t.nf)}: ${esc(id)}<br><a class="btn" style="margin-top:12px" href="#/docs">${esc(t.docs)}</a></div>`;return}
  const mp=f.menu_path||[],url=`docs/files/${encodeURIComponent(f.id)}.txt?v=${(f.sha256||'').slice(0,10)}`;
  document.title=`${ttl(f)} — ${site.meta.title}`;
  const meta=[[t.id,f.id],[t.lines,num(f.lines||0)],[t.size,fsize(f.bytes||0)],[t.created,fdate(f.created_at)],f.category&&[t.cat,f.category],(f.tags&&f.tags.length)&&[t.tags,f.tags.join(', ')]].filter(Boolean);
  w.innerHTML=`<div class="crumb">${crumbHTML(mp,true)}</div>
  <div class="dh"><div class="tt"><h2><span class="lg l-${esc(f.lang)}">${esc(f.lang_label||f.lang)}</span><span>${esc(ttl(f))}</span></h2>
  ${pick(f.desc,f.desc_bn)?`<p class="sub" style="margin:4px 0 0">${esc(pick(f.desc,f.desc_bn))}</p>`:''}</div>
  <div class="acts"><button class="btn" data-a="c" type="button">${esc(t.copy)}</button><button class="btn" data-a="d" type="button">↓ ${esc(t.dl)}</button><a class="btn" href="${url}" target="_blank" rel="noopener">Raw</a></div></div>
  <div class="meta"><span class="id">${esc(f.filename)}</span>${meta.map(([k,v])=>`<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div><div id="code"><div class="sk"></div></div>`;
  let text;
  try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status+' — '+f.id+'.txt');text=await r.text()}
  catch(e){if(my===tok)w.querySelector('#code').innerHTML=`<div class="err">${esc(t.errT)}<small>${esc(e.message)}</small></div>`;return}
  if(my!==tok)return;
  w.querySelector('[data-a=c]').onclick=e=>clip(text,e.currentTarget);
  w.querySelector('[data-a=d]').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=f.filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)};
  w.querySelector('#code').replaceChildren(codeBlock(text));
}
function codeBlock(text){
  const t=T(),ls=text.split('\n');if(ls.length&&ls[ls.length-1]==='')ls.pop();
  const wrap=E('div');if(!ls.length){wrap.append(E('div','empty',esc(t.emptyF)));return wrap}
  const box=E('div','cb'),gt=E('pre','gt'),cd=E('pre','cd'),code=E('code');cd.append(code);box.append(gt,cd);
  const info=E('div','note'),more=E('div','bar');more.style.justifyContent='center';wrap.append(box,more,info);
  const STEP=600;let n=0;
  const paint=to=>{const end=Math.min(ls.length,to),g=[],c=[];
    for(let i=n;i<end;i++){g.push(i+1);const s=ls[i];c.push(s.length>3000?s.slice(0,3000)+' … ':s)}
    gt.append(document.createTextNode((n?'\n':'')+g.join('\n')));code.append(document.createTextNode((n?'\n':'')+c.join('\n')));n=end;
    more.innerHTML='';info.textContent='';
    if(n<ls.length){info.textContent=t.trunc(num(n))+' / '+num(ls.length);
      const b1=E('button','btn',esc(t.showMore(num(Math.min(STEP,ls.length-n)))));b1.type='button';b1.onclick=()=>paint(n+STEP);
      const b2=E('button','btn',esc(t.showAll));b2.type='button';b2.onclick=()=>paint(ls.length);more.append(b1,b2)}};
  paint(STEP);return wrap}

/* ---------- command center ---------- */
let shTab='cmds',cmdQ='',cmdG='';
function openSheet(tab){if(tab)shTab=tab;const c=$('#cc');c.classList.add('on');c.setAttribute('aria-hidden','false');drawSheet()}
function closeSheet(){const c=$('#cc');c.classList.remove('on');c.setAttribute('aria-hidden','true')}
function drawSheet(){
  const t=T();$('#sht').textContent='⚡ '+t.cc;const tb=$('#tabs');tb.innerHTML='';
  [['cmds',t.tCmd],['tools',t.tTools],['info',t.tInfo]].forEach(([k,l])=>{const b=E('button','chip'+(k===shTab?' on':''),esc(l));b.type='button';b.setAttribute('role','tab');b.onclick=()=>{shTab=k;drawSheet()};tb.append(b)});
  const box=$('#shb');box.innerHTML='';box.scrollTop=0;({cmds:sCmds,tools:sTools,info:sInfo})[shTab](box)}
function sCmds(b){
  const t=T(),all=site.meta.commands||[],gs=[...new Set(all.map(x=>x.group).filter(Boolean))];
  const inp=E('input','sq');inp.type='search';inp.placeholder=t.flt;inp.value=cmdQ;b.append(inp);
  if(gs.length){const bar=E('div','bar');['',...gs].forEach(g=>{const c=E('button','chip'+(cmdG===g?' on':''),esc(g||t.all));c.type='button';c.onclick=()=>{cmdG=g;drawSheet()};bar.append(c)});b.append(bar)}
  const box=E('div');b.append(box);
  const paint=()=>{box.innerHTML='';const q=cmdQ.toLowerCase(),r=all.filter(x=>(!cmdG||x.group===cmdG)&&(!q||[x.en,x.bn,x.cmd,x.group].join(' ').toLowerCase().includes(q)));
    if(!r.length){box.append(E('div','empty',esc(t.noRes)));return}
    r.forEach(x=>{const d=E('div','ci'+(x.emergency?' em':''),`<div class="ci-d">${x.emergency?'🚨 ':''}${esc(pick(x.en,x.bn))}</div><div class="ci-r"><code>${esc(x.cmd)}</code><button type="button">${esc(t.copy)}</button></div>`);
      d.querySelector('button').onclick=e=>clip(x.cmd,e.currentTarget);box.append(d)})};
  inp.oninput=()=>{cmdQ=inp.value;paint()};paint()}
function sTools(b){
  const t=T(),g=E('div','tls');
  [['🌐 '+t.tl,()=>document.querySelector('#lang button[data-l="'+(lang==='en'?'bn':'en')+'"]').click()],
   ['🔗 '+t.cl,e=>clip(location.href,e.currentTarget)],
   ['⬇ '+t.ex,async()=>{try{await loadDB()}catch(e){return}const o={...DB};['byId','nodes','par','cnt','langs','lines','bytes'].forEach(k=>delete o[k]);o.files=o.files.map(({_s,...f})=>f);
     const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='index.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}],
   ['🖨 '+t.pr,()=>{closeSheet();setTimeout(()=>print(),150)}],
   ['⬆ '+t.up,()=>{closeSheet();$('#view').scrollTo({top:0,behavior:'smooth'})}],
   ['🔄 '+t.rf,()=>location.reload()]].forEach(([l,f])=>{const x=E('button','tl',esc(l));x.type='button';x.onclick=f;g.append(x)});b.append(g)}
function sInfo(b){
  const t=T(),m=site.meta,rows=[[t.ver,'v'+m.version]];
  if(DB)rows.push([t.files,num(DB.files.length)],[t.folders,num(DB.nodes.size)],[t.size,fsize(DB.bytes)],[t.upd,fdt(DB.updated_at)]);
  b.append(E('div','kv',rows.map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join('')));
  b.append(E('h4','',esc(t.sc)));
  b.append(E('div','kv',[['/',t.kS],['C',t.kC],['Esc',t.kE]].map(([k,v])=>`<span>${esc(v)}</span><kbd>${esc(k)}</kbd>`).join('')))}
})();
</script>
