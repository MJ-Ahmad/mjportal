<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1b1f">
<title>ব্যক্তিগত ভল্ট · নিজের খাতা</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/branding/logos/favicon/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/branding/logos/app-icons/ios-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0d1b1f;--panel:#14292e;--panel2:#1b3439;--line:#2c4d4a;--ink:#e6f0ec;--muted:#93aaa4;--amber:#e0a445;--moss:#5fae8e;--danger:#e27d6b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(24px + env(safe-area-inset-bottom,0px))}
a{color:var(--amber)}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Login */
.gate{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.lock{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--amber)}
.lock svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.5rem;margin:6px 0 8px}
.muted{color:var(--muted);font-size:.93rem;margin:0 0 18px}
form{display:grid;gap:10px;text-align:left}
label{font-size:.9rem;color:var(--muted)}
input[type=password],input[type=search]{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn,button.primary{min-height:48px;padding:10px 16px;border:0;border-radius:12px;background:var(--amber);color:#1a1205;font-weight:600}
button.primary:disabled{opacity:.6}
.err{color:var(--danger);min-height:1.4em;margin:4px 0 0;font-size:.93rem}
.back{display:inline-block;margin-top:14px;font-size:.92rem}

/* Vault */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.top strong{font-size:1.02rem}
.top button,.top a{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px 0}
.tabs button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:.92rem}
.tabs button[aria-selected=true]{color:#1a1205;background:var(--amber);border-color:var(--amber);font-weight:600}
.tabs span{font-size:.8rem;opacity:.85}
.toolbar{padding:10px 12px}
main{padding:0 12px 24px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.tile{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--panel2)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row .meta{flex:1;min-width:0}
.row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted)}
.row video{width:100%;border-radius:10px;background:#000}
.row audio{width:100%}
.ghost{min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--amber);background:transparent;color:var(--amber)}
.ghost:disabled{opacity:.5}

/* Lightbox */
#lightbox{position:fixed;inset:0;z-index:50;background:#000e;display:grid;grid-template-rows:auto 1fr auto;padding:10px}
#lightbox .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
#lightbox .stage{display:flex;align-items:center;justify-content:center;gap:8px;min-height:0}
#lbImg{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lightbox button{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.2rem}
#lbCap{margin:0;text-align:center;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Login (ID + password) & profile */
.sub{margin-top:14px}
.hero{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.hero img{width:96px;height:96px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}
.hero h2{margin:0;font-size:1.25rem}
.hero small{color:var(--muted)}
.sec{margin:18px 0 8px;font-size:1.05rem;color:var(--amber)}
.ledger{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
.ledger td,.ledger th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:.93rem;vertical-align:top}
.ledger th{color:var(--muted);font-weight:500}
.total{font-weight:600;color:var(--moss)}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
.tabs2 button{flex:1;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}
.tabs2 button[aria-selected=true]{background:var(--amber);color:#1a1205;border-color:var(--amber);font-weight:600}
.gallery img,.gallery video{width:100%;border-radius:12px;background:#000;display:block}
.gallery p{color:var(--muted)}
</style>
</head>
<body>

<section id="authGate" class="gate">
  <div class="card">
    <div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 id="authTitle">লগইন</h1>
    <p class="muted" id="authSub">আইডি ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p>
    <form id="authForm" autocomplete="off">
      <label for="uid">ইউজার আইডি</label>
      <input id="uid" type="text" autocomplete="username" required>
      <label for="upw">পাসওয়ার্ড</label>
      <input id="upw" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">প্রবেশ করুন</button>
      <p class="err" id="authMsg" role="alert"></p>
    </form>
    <a class="back" href="../">← মূল পাতায় ফিরুন</a>
  </div>
</section>

<section id="profile" hidden>
  <header class="top"><a href="../">← হোম</a><strong>আমার প্রোফাইল</strong><button type="button" data-logout>লগআউট</button></header>
  <main id="profileBody"></main>
</section>

<section id="adminView" hidden>
  <header class="top"><a href="../">← হোম</a><strong>অ্যাডমিন প্যানেল</strong><button type="button" data-logout>লগআউট</button></header>
  <main id="adminBody"></main>
</section>

<section id="gate" class="gate" hidden>
  <div class="card">
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>ব্যক্তিগত ভল্ট</h1>
    <p class="muted">এখানকার ফটো, ভিডিও, অডিও ও ডকুমেন্ট পাসওয়ার্ড ছাড়া দেখা যায় না। ফাইলগুলো এনক্রিপ্টেড অবস্থায় থাকে।</p>
    <form id="loginForm" autocomplete="off">
      <label for="pw">পাসওয়ার্ড</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary" id="unlockBtn" type="submit">খুলুন</button>
      <p class="err" id="msg" role="alert"></p>
    </form>
    <a class="back" href="../">← মূল পাতায় ফিরুন</a>
  </div>
</section>

<section id="vault" hidden>
  <header class="top">
    <a href="../">← হোম</a>
    <strong>ব্যক্তিগত ভল্ট</strong>
    <button type="button" id="lockBtn">লক</button>
  </header>
  <nav class="tabs" role="tablist" aria-label="বিভাগ">
    <button type="button" role="tab" data-tab="photos" aria-selected="true">ফটো <span>0</span></button>
    <button type="button" role="tab" data-tab="videos" aria-selected="false">ভিডিও <span>0</span></button>
    <button type="button" role="tab" data-tab="audio" aria-selected="false">অডিও <span>0</span></button>
    <button type="button" role="tab" data-tab="documents" aria-selected="false">ডকুমেন্ট <span>0</span></button>
  </nav>
  <div class="toolbar"><input id="search" type="search" placeholder="নাম দিয়ে খুঁজুন" aria-label="খুঁজুন"></div>
  <main id="list"></main>
</section>

<div id="lightbox" hidden role="dialog" aria-label="ছবি দেখুন">
  <div class="bar">
    <button type="button" id="lbClose" aria-label="বন্ধ করুন">✕</button>
    <p id="lbCap"></p>
    <span style="width:44px"></span>
  </div>
  <div class="stage">
    <button type="button" id="lbPrev" aria-label="আগের ছবি">‹</button>
    <img id="lbImg" alt="">
    <button type="button" id="lbNext" aria-label="পরের ছবি">›</button>
  </div>
  <div></div>
</div>

<script src="auth.js" defer></script>
<script src="app.js" defer></script>
<script src="../assets/install.js" defer></script>
</body>
</html>
