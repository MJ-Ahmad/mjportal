<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f4c42">
  <title>JSON Viewer — MJ Ahmad</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f2;
      --panel: #fff;
      --panel-soft: #f8faf8;
      --ink: #17211d;
      --muted: #64716b;
      --line: #d9dfdb;
      --pine: #0f4c42;
      --pine-dark: #092f29;
      --brass: #b8862b;
      --selected: #e3eeea;
      --code: #101916;
      --code-ink: #d8e4df;
      --code-muted: #788b83;
      --code-key: #9dc9ff;
      --code-string: #9ee0a4;
      --code-number: #ffd18c;
      --code-bool: #d8a8ff;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font: 15px/1.6 "Hind Siliguri", "Noto Sans Bengali",
            "Kalpurush", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1514;
        --panel: #161e1c;
        --panel-soft: #1b2521;
        --ink: #e6ece9;
        --muted: #93a29c;
        --line: #26332f;
        --pine: #5fb59f;
        --pine-dark: #0b3a32;
        --brass: #d4a74a;
        --selected: #1e2d29;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .topbar {
      position: relative;
      z-index: 50;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 18px;
      background: var(--pine-dark);
      color: #f3f5f2;
    }

    .brand {
      display: flex;
      min-width: 190px;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      flex: none;
      place-items: center;
      border: 1px solid #ffffff25;
      border-radius: 10px;
      background: #ffffff12;
      color: var(--brass);
      font: 700 14px ui-monospace, Menlo, Consolas, monospace;
    }

    .brand-copy {
      min-width: 0;
      line-height: 1.2;
    }

    .brand-copy strong {
      display: block;
      overflow: hidden;
      font-size: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy small {
      display: block;
      margin-top: 3px;
      color: #ffffffb8;
      font-size: 11px;
    }

    .menu-toggle {
      display: none;
      width: 36px;
      height: 36px;
      flex: none;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-size: 21px;
      cursor: pointer;
    }

    #search {
      width: min(480px, 55vw);
      min-width: 150px;
      margin-left: auto;
      padding: 8px 12px;
      border: 1px solid #ffffff40;
      border-radius: 9px;
      outline: none;
      background: #ffffff16;
      color: #fff;
      font: inherit;
      font-size: 14px;
      transition: border-color .15s, background .15s;
    }

    #search::placeholder {
      color: #ffffffae;
    }

    #search:focus {
      border-color: var(--brass);
      background: #ffffff20;
      box-shadow: 0 0 0 3px #b8862b35;
    }

    .workspace {
      height: calc(100dvh - 60px);
      display: grid;
      grid-template-columns: 295px minmax(0, 1fr);
      min-height: 0;
    }

    .file-nav {
      min-height: 0;
      overflow: auto;
      padding: 13px 9px 24px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overscroll-behavior: contain;
    }

    .nav-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 8px 9px;
    }

    .nav-heading h2 {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    #result-count {
      margin: 0 8px 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .file-list {
      display: grid;
      gap: 3px;
    }

    .file-item {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .file-item:hover {
      background: var(--bg);
    }

    .file-item[aria-current="page"] {
      background: var(--selected);
      color: var(--pine);
      box-shadow: inset 3px 0 var(--brass);
    }

    .item-title {
      display: block;
      overflow: hidden;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-meta {
      display: block;
      margin-top: 2px;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.45;
    }

    .content {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 25px 30px calc(38px + var(--safe-bottom));
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }

    .content-inner {
      width: min(100%, 1120px);
      margin: 0 auto;
    }

    .welcome {
      padding: 58px 12px;
      color: var(--muted);
      text-align: center;
    }

    .welcome-mark {
      width: 62px;
      height: 62px;
      display: grid;
      margin: 0 auto 15px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      color: var(--pine);
      box-shadow: 0 8px 24px #0000000a;
      font: 700 18px ui-monospace, Menlo, Consolas, monospace;
    }

    .welcome h2 {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: 22px;
    }

    .welcome p {
      max-width: 570px;
      margin: 0 auto;
    }

    .file-header {
      margin-bottom: 17px;
      padding: 2px 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .file-title {
      min-width: 0;
      margin: 0;
      font-size: clamp(22px, 3vw, 31px);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .valid-badge {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border: 1px solid #2e7d4f45;
      border-radius: 20px;
      background: #2e7d4f12;
      color: #2e7d4f;
      font-size: 11px;
      font-weight: 650;
    }

    .file-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .file-id {
      padding: 1px 9px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--pine);
      font: 11.5px ui-monospace, Menlo, Consolas, monospace;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 15px 0;
    }

    .view-switch {
      display: inline-flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .view-button,
    .action-button {
      min-height: 37px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    .view-button[aria-pressed="true"] {
      background: var(--selected);
      color: var(--pine);
      font-weight: 650;
    }

    .view-button:hover,
    .action-button:hover {
      color: var(--pine);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .action-button {
      border-color: var(--line);
      background: var(--panel);
      color: var(--ink);
      font-weight: 600;
    }

    .action-button.primary {
      border-color: var(--pine);
      background: var(--pine);
      color: #fff;
    }

    .action-button.primary:hover {
      filter: brightness(1.08);
      color: #fff;
    }

    .tree-panel,
    .code-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 6px 22px #00000008;
    }

    .tree-panel {
      padding: 13px 15px;
    }

    .tree-help {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .tree {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .tree details {
      margin: 2px 0 2px 14px;
    }

    .tree > details {
      margin-left: 0;
    }

    .tree summary {
      width: fit-content;
      max-width: 100%;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      list-style-position: outside;
      overflow-wrap: anywhere;
    }

    .tree summary:hover {
      background: var(--selected);
    }

    .tree-leaf {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 3px;
      margin: 3px 0 3px 22px;
      padding: 3px 6px;
      border-radius: 5px;
      overflow-wrap: anywhere;
    }

    .tree-leaf:hover {
      background: var(--panel-soft);
    }

    .tree-key {
      color: var(--pine);
      font-weight: 650;
    }

    .tree-string {
      color: #2e7d4f;
      overflow-wrap: anywhere;
    }

    .tree-number {
      color: #a45b18;
    }

    .tree-boolean {
      color: #7251a3;
    }

    .tree-null,
    .tree-type,
    .tree-empty {
      color: var(--muted);
      font-style: italic;
    }

    .tree-index {
      color: var(--muted);
      font: 11px ui-monospace, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      .tree-string { color: #80c995; }
      .tree-number { color: #e6b66e; }
      .tree-boolean { color: #c4a4ef; }
    }

    .code-panel {
      border-color: #24352e;
      background: var(--code);
      color: var(--code-ink);
    }

    .code-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 13px;
      border-bottom: 1px solid #ffffff18;
      background: #ffffff07;
    }

    .code-heading strong {
      color: #b7ccc2;
      font-size: 12px;
      font-weight: 600;
    }

    .code-heading span {
      color: var(--code-muted);
      font: 11px ui-monospace, Menlo, Consolas, monospace;
    }

    .code-scroll {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      max-height: min(72dvh, 900px);
      overflow: auto;
      overscroll-behavior: contain;
      font: 12.5px/1.7 ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    .line-numbers,
    .formatted-code {
      min-height: 100%;
      margin: 0;
      padding-top: 13px;
      padding-bottom: 15px;
      white-space: pre;
    }

    .line-numbers {
      position: sticky;
      left: 0;
      z-index: 1;
      min-width: 48px;
      padding-right: 11px;
      padding-left: 12px;
      border-right: 1px solid #ffffff14;
      background: var(--code);
      color: var(--code-muted);
      text-align: right;
      user-select: none;
    }

    .formatted-code {
      min-width: max-content;
      padding-right: 18px;
      padding-left: 14px;
      color: var(--code-ink);
    }

    .json-key { color: var(--code-key); }
    .json-string { color: var(--code-string); }
    .json-number { color: var(--code-number); }
    .json-boolean,
    .json-null { color: var(--code-bool); }

    .error-box {
      padding: 15px;
      border: 1px solid #b3412e66;
      border-radius: 10px;
      background: var(--panel);
      color: #b3412e;
      overflow-wrap: anywhere;
    }

    .message {
      margin: 16px 8px;
      color: var(--muted);
      text-align: center;
    }

    .mobile-nav {
      display: none;
    }

    @media (max-width: 820px) {
      .topbar {
        height: 52px;
        gap: 6px;
        padding: 6px 9px;
      }

      .brand {
        min-width: 0;
        gap: 7px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
      }

      .brand-copy strong {
        max-width: 118px;
        font-size: 14px;
      }

      .brand-copy small {
        display: none;
      }

      .menu-toggle {
        display: grid;
      }

      #search {
        width: auto;
        min-width: 0;
        flex: 1;
        margin-left: auto;
        padding: 7px 9px;
        font-size: 12px;
      }

      .workspace {
        height: calc(100dvh - 52px);
        display: block;
      }

      .file-nav {
        position: fixed;
        z-index: 45;
        top: 52px;
        bottom: calc(64px + var(--safe-bottom));
        left: 0;
        width: min(320px, 88vw);
        padding: 12px 9px;
        border-right: 1px solid var(--line);
        box-shadow: 5px 0 25px #0004;
        transform: translateX(-105%);
        transition: transform .2s ease;
      }

      .file-nav.on {
        transform: translateX(0);
      }

      .content {
        width: 100%;
        height: 100%;
        padding: 16px 12px calc(80px + var(--safe-bottom));
      }

      .title-row {
        gap: 7px;
      }

      .file-title {
        font-size: 22px;
      }

      .file-meta {
        gap: 5px 8px;
        font-size: 11px;
      }

      .toolbar {
        align-items: stretch;
      }

      .view-switch {
        flex: 1;
      }

      .view-button {
        flex: 1;
        padding-right: 8px;
        padding-left: 8px;
      }

      .toolbar-actions {
        width: 100%;
      }

      .toolbar-actions .action-button {
        flex: 1;
      }

      .tree-panel {
        padding: 10px 8px;
      }

      .tree details {
        margin-left: 8px;
      }

      .tree-leaf {
        margin-left: 14px;
        font-size: 13px;
      }

      .mobile-nav {
        position: fixed;
        z-index: 60;
        right: 0;
        bottom: 0;
        left: 0;
        height: calc(62px + var(--safe-bottom));
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: start;
        padding: 5px 4px var(--safe-bottom);
        border-top: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 -3px 16px #0000000d;
      }

      .mobile-nav a,
      .mobile-nav button {
        min-width: 0;
        height: 49px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1px;
        padding: 2px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        line-height: 1.2;
        text-decoration: none;
        cursor: pointer;
      }

      .mobile-nav a:active,
      .mobile-nav button:active {
        background: var(--selected);
      }

      .mobile-nav .active {
        color: var(--pine);
        font-weight: 650;
      }

      .mobile-nav .active .nav-icon {
        color: var(--brass);
      }

      .nav-icon {
        width: 23px;
        height: 23px;
        display: grid;
        place-items: center;
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      body {
        height: auto;
        overflow: visible;
        background: #fff;
        color: #111;
      }

      .topbar,
      .file-nav,
      .mobile-nav,
      .toolbar {
        display: none !important;
      }

      .workspace,
      .content {
        height: auto;
        display: block;
        overflow: visible;
        padding: 0;
      }

      .code-scroll {
        max-height: none;
        overflow: visible;
      }

      .line-numbers {
        position: static;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button
      id="menu-toggle"
      class="menu-toggle"
      type="button"
      aria-label="JSON ফাইলের তালিকা খুলুন"
      aria-expanded="false"
      aria-controls="file-nav"
    >☰</button>

    <a class="brand" href="../" aria-label="মূল পাতা">
      <span class="brand-mark" aria-hidden="true">{ }</span>
      <span class="brand-copy">
        <strong>JSON Viewer</strong>
        <small>নিজের খাতা · MJ Ahmad</small>
      </span>
    </a>

    <input
      id="search"
      type="search"
      placeholder="ID, ফাইল, ফোল্ডার, key বা value…"
      aria-label="JSON ফাইল খুঁজুন"
      autocomplete="off"
      spellcheck="false"
    >
  </header>

  <main class="workspace">
    <nav id="file-nav" class="file-nav" aria-label="JSON ফাইলের তালিকা">
      <div class="nav-heading">
        <h2>JSON ফাইল</h2>
      </div>
      <p id="result-count" aria-live="polite">তালিকা লোড হচ্ছে…</p>
      <div id="file-list" class="file-list"></div>
    </nav>

    <article id="content" class="content" tabindex="-1" aria-live="polite">
      <div class="content-inner">
        <div class="welcome">
          <div class="welcome-mark" aria-hidden="true">{ }</div>
          <h2>JSON নথি</h2>
          <p>ফাইল বাছুন অথবা ID, ফাইলের নাম, ফোল্ডার, key কিংবা value দিয়ে সার্চ করুন।</p>
        </div>
      </div>
    </article>
  </main>

  <nav class="mobile-nav" aria-label="প্রধান নেভিগেশন">
    <a href="../">
      <span class="nav-icon" aria-hidden="true">⌂</span>
      <span>মেইন সাইট</span>
    </a>
    <a href="../#/dash">
      <span class="nav-icon" aria-hidden="true">▦</span>
      <span>ড্যাশবোর্ড</span>
    </a>
    <a href="../learn/">
      <span class="nav-icon" aria-hidden="true">◆</span>
      <span>লার্নিং</span>
    </a>
    <a href="../terminal/">
      <span class="nav-icon" aria-hidden="true">&gt;_</span>
      <span>টার্মিনাল</span>
    </a>
    <button
      id="bottom-menu"
      class="active"
      type="button"
      aria-label="JSON ফাইলের মেনু"
      aria-expanded="false"
      aria-controls="file-nav"
    >
      <span class="nav-icon" aria-hidden="true">☰</span>
      <span>মেনু</span>
    </button>
  </nav>

  <script>
    (() => {
      "use strict";

      const fileNav = document.querySelector("#file-nav");
      const fileList = document.querySelector("#file-list");
      const resultCount = document.querySelector("#result-count");
      const content = document.querySelector("#content");
      const search = document.querySelector("#search");
      const menuToggle = document.querySelector("#menu-toggle");
      const bottomMenu = document.querySelector("#bottom-menu");

      let files = [];
      let selectedPath = "";
      let currentData = null;
      let currentFile = null;
      let currentPrettyJson = "";
      let currentView = "tree";
      let requestNumber = 0;

      const isMobile = () => window.matchMedia("(max-width: 820px)").matches;
      const normalize = value => String(value ?? "").toLocaleLowerCase().trim();

      function showMessage(parent, text, isError = false) {
        const node = document.createElement("p");
        node.className = isError ? "error-box" : "message";
        node.textContent = text;
        parent.replaceChildren(node);
      }

      function setMenuOpen(open) {
        fileNav.classList.toggle("on", open);
        menuToggle.setAttribute("aria-expanded", String(open));
        bottomMenu.setAttribute("aria-expanded", String(open));
      }

      function searchableText(file) {
        return [
          file.id,
          file.title,
          file.path,
          file.folder,
          file.search_text
        ].map(normalize).join(" ");
      }

      function renderList() {
        const terms = normalize(search.value).split(/\s+/).filter(Boolean);
        const matches = files.filter(file => {
          const text = searchableText(file);
          return terms.every(term => text.includes(term));
        });

        resultCount.textContent = `${matches.length}টি ফাইল`;
        fileList.replaceChildren();

        if (!matches.length) {
          showMessage(fileList, "মিল পাওয়া যায়নি। অন্য ID, নাম, key বা value দিয়ে খুঁজুন।");
          return;
        }

        for (const file of matches) {
          const button = document.createElement("button");
          button.className = "file-item";
          button.type = "button";
          button.setAttribute(
            "aria-current",
            file.path === selectedPath ? "page" : "false"
          );

          const title = document.createElement("span");
          title.className = "item-title";
          title.textContent = file.title || file.path;

          const meta = document.createElement("span");
          meta.className = "item-meta";
          meta.textContent = `${file.id || "ID নেই"} · ${file.path}`;

          button.append(title, meta);
          button.addEventListener("click", () => openFile(file));
          fileList.append(button);
        }
      }

      function dateText(value) {
        if (!value) return "—";

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);

        try {
          return new Intl.DateTimeFormat("bn-BD", {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }).format(date);
        } catch {
          return date.toLocaleString();
        }
      }

      function safePath(path) {
        if (typeof path !== "string" || !path || path.startsWith("/")) {
          throw new Error("JSON ফাইলের path সঠিক নয়।");
        }

        const parts = path.split("/");
        if (parts.some(part => !part || part === "." || part === "..")) {
          throw new Error("JSON ফাইলের path নিরাপদ নয়।");
        }

        return parts.map(encodeURIComponent).join("/");
      }

      function addText(parent, text, className = "") {
        const node = document.createElement("span");
        if (className) node.className = className;
        node.textContent = text;
        parent.append(node);
        return node;
      }

      function valueType(value) {
        if (value === null) return "null";
        if (Array.isArray(value)) return "Array";
        if (typeof value === "object") return "Object";
        return typeof value;
      }

      function renderTreeValue(parent, value, key, depth) {
        const isContainer = value !== null && typeof value === "object";
        const isArray = Array.isArray(value);

        if (isContainer) {
          const entries = isArray
            ? value.map((child, index) => [String(index), child])
            : Object.entries(value);

          const details = document.createElement("details");
          details.open = depth < 1;

          const summary = document.createElement("summary");

          if (key !== null) {
            addText(summary, JSON.stringify(String(key)), "tree-key");
            addText(summary, ": ");
          }

          addText(
            summary,
            `${isArray ? "Array" : "Object"} · ${entries.length}`,
            "tree-type"
          );

          details.append(summary);

          if (entries.length === 0) {
            const empty = document.createElement("div");
            empty.className = "tree-leaf tree-empty";
            empty.textContent = isArray ? "[]" : "{}";
            details.append(empty);
          } else {
            for (const [childKey, childValue] of entries) {
              renderTreeValue(
                details,
                childValue,
                isArray ? null : childKey,
                depth + 1
              );
            }
          }

          parent.append(details);
          return;
        }

        const row = document.createElement("div");
        row.className = "tree-leaf";

        if (key !== null) {
          addText(row, JSON.stringify(String(key)), "tree-key");
          addText(row, ": ");
        }

        if (typeof value === "string") {
          addText(row, JSON.stringify(value), "tree-string");
        } else if (typeof value === "number") {
          addText(row, String(value), "tree-number");
        } else if (typeof value === "boolean") {
          addText(row, String(value), "tree-boolean");
        } else {
          addText(row, "null", "tree-null");
        }

        parent.append(row);
      }

      function appendHighlightedLine(parent, line) {
        const tokenPattern =
          /("(?:\\.|[^"\\])*"(?=\s*:))|("(?:\\.|[^"\\])*")|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;

        let lastIndex = 0;
        let match;

        while ((match = tokenPattern.exec(line)) !== null) {
          if (match.index > lastIndex) {
            parent.append(document.createTextNode(line.slice(lastIndex, match.index)));
          }

          const token = document.createElement("span");
          token.textContent = match[0];

          if (match[1]) {
            token.className = "json-key";
          } else if (match[2]) {
            token.className = "json-string";
          } else if (match[3] === "true" || match[3] === "false") {
            token.className = "json-boolean";
          } else if (match[3] === "null") {
            token.className = "json-null";
          } else {
            token.className = "json-number";
          }

          parent.append(token);
          lastIndex = tokenPattern.lastIndex;
        }

        if (lastIndex < line.length) {
          parent.append(document.createTextNode(line.slice(lastIndex)));
        }
      }

      function makeFormattedView(prettyJson) {
        const panel = document.createElement("section");
        panel.className = "code-panel";
        panel.setAttribute("aria-label", "Formatted JSON");

        const heading = document.createElement("div");
        heading.className = "code-heading";

        const label = document.createElement("strong");
        label.textContent = "Formatted JSON";

        const lineCount = prettyJson.split("\n").length;
        const count = document.createElement("span");
        count.textContent = `${lineCount} লাইন`;

        heading.append(label, count);

        const scroll = document.createElement("div");
        scroll.className = "code-scroll";

        const lineNumbers = document.createElement("pre");
        lineNumbers.className = "line-numbers";
        lineNumbers.setAttribute("aria-hidden", "true");
        lineNumbers.textContent = Array.from(
          { length: lineCount },
          (_, index) => String(index + 1)
        ).join("\n");

        const code = document.createElement("pre");
        code.className = "formatted-code";
        code.setAttribute("aria-label", "Formatted JSON code");

        const lines = prettyJson.split("\n");
        lines.forEach((line, index) => {
          appendHighlightedLine(code, line);
          if (index < lines.length - 1) {
            code.append(document.createTextNode("\n"));
          }
        });

        scroll.append(lineNumbers, code);
        panel.append(heading, scroll);
        return panel;
      }

      function makeTreeView(data) {
        const panel = document.createElement("section");
        panel.className = "tree-panel";

        const help = document.createElement("p");
        help.className = "tree-help";
        help.textContent = "কোনো অংশ খুলতে বা বন্ধ করতে তার পাশের তীরচিহ্নে চাপ দিন।";

        const tree = document.createElement("div");
        tree.className = "tree";
        renderTreeValue(tree, data, null, 0);

        panel.append(help, tree);
        return panel;
      }

      function renderCurrentView() {
        if (!currentFile || currentData === null && currentPrettyJson !== "null") {
          return;
        }

        const viewHost = document.querySelector("#data-view");
        if (!viewHost) return;

        viewHost.replaceChildren(
          currentView === "tree"
            ? makeTreeView(currentData)
            : makeFormattedView(currentPrettyJson)
        );

        document.querySelectorAll(".view-button").forEach(button => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.view === currentView)
          );
        });

        const expandButton = document.querySelector("#expand-toggle");
        if (expandButton) {
          expandButton.hidden = currentView !== "tree";
        }
      }

      async function copyFormattedJson(button) {
        const originalText = button.textContent;

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(currentPrettyJson);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = currentPrettyJson;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.append(textarea);
            textarea.select();

            const copied = document.execCommand("copy");
            textarea.remove();

            if (!copied) throw new Error("Clipboard copy failed");
          }

          button.textContent = "কপি হয়েছে ✓";
        } catch {
          button.textContent = "কপি করা যায়নি";
        }

        window.setTimeout(() => {
          button.textContent = originalText;
        }, 1600);
      }

      function renderFile(data, file, prettyJson) {
        currentData = data;
        currentFile = file;
        currentPrettyJson = prettyJson;
        currentView = "tree";

        const inner = document.createElement("div");
        inner.className = "content-inner";

        const header = document.createElement("header");
        header.className = "file-header";

        const titleRow = document.createElement("div");
        titleRow.className = "title-row";

        const title = document.createElement("h1");
        title.className = "file-title";
        title.textContent = file.title || file.path;

        const badge = document.createElement("span");
        badge.className = "valid-badge";
        badge.textContent = "✓ বৈধ JSON";

        titleRow.append(title, badge);

        const meta = document.createElement("div");
        meta.className = "file-meta";

        const id = document.createElement("span");
        id.className = "file-id";
        id.textContent = file.id || "ID নেই";

        const path = document.createElement("span");
        path.textContent = `ফাইল: ${file.path}`;

        const created = document.createElement("span");
        created.textContent = `যুক্ত: ${dateText(file.created_at)}`;

        const updated = document.createElement("span");
        updated.textContent = `আপডেট: ${dateText(file.updated_at)}`;

        meta.append(id, path, created, updated);
        header.append(titleRow, meta);

        const toolbar = document.createElement("div");
        toolbar.className = "toolbar";

        const switcher = document.createElement("div");
        switcher.className = "view-switch";
        switcher.setAttribute("role", "group");
        switcher.setAttribute("aria-label", "JSON দেখার ধরন");

        const treeButton = document.createElement("button");
        treeButton.className = "view-button";
        treeButton.type = "button";
        treeButton.dataset.view = "tree";
        treeButton.textContent = "Tree view";
        treeButton.setAttribute("aria-pressed", "true");
        treeButton.addEventListener("click", () => {
          currentView = "tree";
          renderCurrentView();
        });

        const formattedButton = document.createElement("button");
        formattedButton.className = "view-button";
        formattedButton.type = "button";
        formattedButton.dataset.view = "formatted";
        formattedButton.textContent = "Formatted";
        formattedButton.setAttribute("aria-pressed", "false");
        formattedButton.addEventListener("click", () => {
          currentView = "formatted";
          renderCurrentView();
        });

        switcher.append(treeButton, formattedButton);

        const actions = document.createElement("div");
        actions.className = "toolbar-actions";

        const expandButton = document.createElement("button");
        expandButton.id = "expand-toggle";
        expandButton.className = "action-button";
        expandButton.type = "button";
        expandButton.textContent = "সব খুলুন";
        expandButton.addEventListener("click", () => {
          const details = Array.from(
            document.querySelectorAll("#data-view details")
          );
          const allOpen = details.length > 0 && details.every(node => node.open);
          details.forEach(node => { node.open = !allOpen; });
          expandButton.textContent = allOpen ? "সব খুলুন" : "সব বন্ধ করুন";
        });

        const copyButton = document.createElement("button");
        copyButton.className = "action-button primary";
        copyButton.type = "button";
        copyButton.textContent = "Formatted JSON কপি";
        copyButton.addEventListener("click", () => copyFormattedJson(copyButton));

        actions.append(expandButton, copyButton);
        toolbar.append(switcher, actions);

        const viewHost = document.createElement("div");
        viewHost.id = "data-view";

        inner.append(header, toolbar, viewHost);
        content.replaceChildren(inner);
        renderCurrentView();

        document.title = `${file.title || "JSON"} — JSON Viewer`;
      }

      async function openFile(file) {
        const thisRequest = ++requestNumber;
        selectedPath = file.path;
        renderList();

        if (isMobile()) setMenuOpen(false);

        content.scrollTo({ top: 0, behavior: "smooth" });
        showMessage(content, "JSON ফাইল লোড হচ্ছে…");

        try {
          const encodedPath = safePath(file.path);
          const response = await fetch(`files/${encodedPath}`, {
            cache: "no-cache"
          });

          if (!response.ok) {
            throw new Error(`ফাইল লোড হয়নি (HTTP ${response.status})`);
          }

          const raw = await response.text();
          let data;

          try {
            data = JSON.parse(raw);
          } catch (error) {
            const detail = error instanceof Error ? error.message : String(error);
            throw new Error(`JSON parse error: ${detail}`);
          }

          if (thisRequest !== requestNumber) return;

          renderFile(data, file, JSON.stringify(data, null, 2));
        } catch (error) {
          if (thisRequest !== requestNumber) return;
          showMessage(content, `ফাইল খোলা যায়নি: ${error.message || error}`, true);
        }
      }

      async function loadCatalog() {
        try {
          const response = await fetch("catalog.json", { cache: "no-cache" });

          if (!response.ok) {
            throw new Error(`catalog.json লোড হয়নি (HTTP ${response.status})`);
          }

          const catalog = await response.json();

          if (!catalog || !Array.isArray(catalog.files)) {
            throw new Error("catalog.json-এর format সঠিক নয়।");
          }

          files = catalog.files
            .filter(file =>
              file &&
              typeof file.path === "string" &&
              file.path.toLowerCase().endsWith(".json")
            )
            .sort((a, b) =>
              String(b.updated_at || "").localeCompare(String(a.updated_at || "")) ||
              String(a.title || "").localeCompare(String(b.title || ""), "bn")
            );

          renderList();

          if (!files.length) {
            resultCount.textContent = "০টি JSON ফাইল";
            showMessage(
              fileList,
              "json/files/ ফোল্ডারে .json ফাইল রাখুন, তারপর catalog তৈরি করুন।"
            );
          }
        } catch (error) {
          resultCount.textContent = "তালিকা পাওয়া যায়নি";
          showMessage(
            fileList,
            `${error.message || error} — python3 scripts/json_setup.py --index-only চালান।`,
            true
          );
        }
      }

      search.addEventListener("input", renderList);

      menuToggle.addEventListener("click", () => {
        setMenuOpen(!fileNav.classList.contains("on"));
      });

      bottomMenu.addEventListener("click", () => {
        setMenuOpen(!fileNav.classList.contains("on"));
      });

      content.addEventListener("click", () => {
        if (isMobile() && fileNav.classList.contains("on")) {
          setMenuOpen(false);
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && fileNav.classList.contains("on")) {
          setMenuOpen(false);
          menuToggle.focus();
        }

        if (
          event.key === "/" &&
          !/INPUT|TEXTAREA/.test(event.target.tagName || "")
        ) {
          event.preventDefault();
          search.focus();
        }
      });

      window.addEventListener("resize", () => {
        if (!isMobile()) setMenuOpen(false);
      });

      loadCatalog();
    })();
  </script>
</body>
</html>
